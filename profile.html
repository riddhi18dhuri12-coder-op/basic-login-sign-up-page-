<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            display: flex;
            justify-content: flex-start;
            padding-left: 40px;
            border : 20px
            margin-top: 40px;
        }

  #info-box {
    width: 100%;
    max-width: 600px;
    border: 4px solid #4CAF50;
    padding-left: 20px;
}

        h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .name-row {
            display: flex;
            gap: 10px;
        }

        .name-row .form-group {
            flex: 1;
        }

        .checkbox-group label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        #success-msg {
            display: none;
            color: green;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="info-box">
            <h2>Personal Information</h2>

            <form id="info-form">

                <div class="name-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" required placeholder="John">
                    </div>
                    <div class="form-group">
                        <label for="middle-name">Middle Name</label>
                        <input type="text" id="middle-name" placeholder="Robert">
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" required placeholder="Doe">
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact-number">Contact Number</label>
                    <input type="tel" id="contact-number" required placeholder="123-456-7890">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label for="education">Highest Education</label>
                    <select id="education" required>
                        <option value="" disabled selected>Select your qualification</option>
                        <option value="High School">High School</option>
                        <option value="Bachelor's Degree">Bachelor's Degree</option>
                        <option value="Master's Degree">Master's Degree</option>
                        <option value="Ph.D.">Ph.D.</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Skills (Select all that apply)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="skills" value="HTML/CSS"> HTML & CSS</label>
                        <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                        <label><input type="checkbox" name="skills" value="Graphic Design"> Graphic Design</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio">Short Bio</label>
                    <textarea id="bio" rows="3" required placeholder="Tell us about yourself..."></textarea>
                </div>

                <button type="submit">Save Profile</button>

                <p id="success-msg">Profile Saved Successfully!</p>

            </form>
        </div>
    </div>

    <script>
        // If not logged in, send back to auth
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert("Please login first.");
            window.location.href = "auth.html";
        }

        var infoForm = document.getElementById('info-form');
        var successMsg = document.getElementById('success-msg');

        infoForm.addEventListener('submit', function(event) {
            event.preventDefault();

            var firstName = document.getElementById('first-name').value;
            var middleName = document.getElementById('middle-name').value;
            var lastName = document.getElementById('last-name').value;
            var phone = document.getElementById('contact-number').value;
            var dob = document.getElementById('dob').value;
            var education = document.getElementById('education').value;
            var bio = document.getElementById('bio').value;

            var lettersOnly = /^[A-Za-z]+$/;

            if (!lettersOnly.test(firstName)) {
                alert("Please enter a valid First Name.");
                return;
            }

            if (middleName !== "" && !lettersOnly.test(middleName)) {
                alert("Please enter a valid Middle Name.");
                return;
            }

            if (!lettersOnly.test(lastName)) {
                alert("Please enter a valid Last Name.");
                return;
            }

            var numbersOnly = /^[0-9]+$/;
            if (!numbersOnly.test(phone)) {
                alert("Please enter a valid Contact Number.");
                return;
            }

            var selectedDate = new Date(dob);
            var today = new Date();

            if (selectedDate > today) {
                alert("Date of Birth cannot be in the future!");
                return;
            }

            if (bio.trim() === "") {
                alert("Please write something in your Short Bio.");
                return;
            }

            var checkedSkills = [];
            var skillCheckboxes = document.querySelectorAll('input[name="skills"]:checked');
            skillCheckboxes.forEach(function(checkbox) {
                checkedSkills.push(checkbox.value);
            });

            var fullName = firstName;
            if (middleName !== "") {
                fullName = fullName + " " + middleName;
            }
            fullName = fullName + " " + lastName;

            var userData = {
                firstName: firstName,
                lastName: lastName,
                phone: phone,
                dob: dob,
                education: education,
                bio: bio
            };

            localStorage.setItem('userProfile', JSON.stringify(userData));

            successMsg.style.display = "block";

            alert(
                "Profile Saved Successfully!\n\n" +
                "Name: " + fullName + "\n" +
                "Phone: " + phone + "\n" +
                "Education: " + education + "\n" +
                "Skills: " + (checkedSkills.length > 0 ? checkedSkills.join(', ') : "None selected")
            );

            window.location.href = "dashboard.html";
        });
    </script>

</body>
</html>
