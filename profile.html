<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
.container {
            display: flex;
            justify-content: flex-start; 
            padding-left: 40px;
            margin-top: 40px;            
        }

        
        #info-box {
            width: 100%;
            max-width: 600px;         
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .name-row {
            display: flex;
            gap: 10px;
        }

        .name-row .form-group {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="info-box">
            <div class="profile-header">
                <h2>Personal Information</h2>
            </div>

         
            
            <form id="info-form">
                
               
                <div class="name-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" required placeholder="John">
                    </div>
                    <div class="form-group">
                        <label for="middle-name">Middle Name</label>
                        <input type="text" id="middle-name" placeholder="Robert">
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" required placeholder="Doe">
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact-number">Contact Number</label>
                    <input type="tel" id="contact-number" required placeholder="123-456-7890">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label for="education">Highest Education</label>
                    <select id="education" required class="select-input">
                        <option value="" disabled selected>Select your qualification</option>
                        <option value="High School">High School</option>
                        <option value="Bachelor's Degree">Bachelor's Degree</option>
                        <option value="Master's Degree">Master's Degree</option>
                        <option value="Ph.D.">Ph.D.</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Skills (Select all that apply)</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="skills" value="HTML/CSS"> HTML & CSS
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="skills" value="JavaScript"> JavaScript
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="skills" value="Graphic Design"> Graphic Design
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio">Short Bio</label>
                    <textarea id="bio" rows="3" required placeholder="Tell us about yourself..."></textarea>
                </div>

                <button type="submit">Save Profile</button>
            </form>
        </div>

    </div>

    <script>
        const infoForm = document.getElementById('info-form');
        const successMsg = document.getElementById('success-msg');

        infoForm.addEventListener('submit', function(event) {
            event.preventDefault();             
            
            const firstName = document.getElementById('first-name').value;
            const middleName = document.getElementById('middle-name').value;
            const lastName = document.getElementById('last-name').value;
            const phone = document.getElementById('contact-number').value;
            const education = document.getElementById('education').value;
            const bio = document.getElementById('bio').value;
            
            
            const allowedLetters = /^[A-Za-z]+$/;

            if (!allowedLetters.test(firstName)) {
                alert("Please enter a valid First Name.");
                return;
            }
            
           
            if (middleName !== "" && !allowedLetters.test(middleName)) {
                alert("Please enter a valid Middle Name.");
                return;
            }

            if (!allowedLetters.test(lastName)) {
                alert("Please enter a valid Last Name. ");
                return;
            }

            
            const allowedPhone = /^[0-9]+$/;
            if (!allowedPhone.test(phone)) {
                alert("Please enter a valid Contact Number.");
                return;
            }

            const selectedDate = new Date(dob);
            const today = new Date();

          
            if (selectedDate > today) {
                alert("Date of Birth cannot be in the future!");
                return;
            }
            
            if (bio.trim() === "") {
                alert("Please write something in your Short Bio.");
                return;
            }
            
           
            const checkedSkills = [];
            const skillCheckboxes = document.querySelectorAll('input[name="skills"]:checked');
            skillCheckboxes.forEach(function(checkbox) {
                checkedSkills.push(checkbox.value);
            });

            let fullDisplayName = firstName;
            if (middleName !== "") {
                fullDisplayName += " " + middleName;
            }
            fullDisplayName += " " + lastName;

            successMsg.style.display = "block";

         
            alert(
                "Profile Saved Successfully!\n\n" +
                "Name: " + fullDisplayName + "\n" +
                "Phone: " + phone + "\n" +
                "Education: " + education + "\n" +
                "Skills: " + (checkedSkills.length > 0 ? checkedSkills.join(', ') : "None selected")
            );
        });
    </script>
</body>
</html>
