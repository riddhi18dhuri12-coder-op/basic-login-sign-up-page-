<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            display: flex;
            justify-content: flex-start;
            padding-left: 40px;
            margin-top: 40px;
        }

        #signup-box, #login-box {
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        .toggle-text {
            margin-top: 15px;
        }

        .toggle-text a {
            color: #4CAF50;
            text-decoration: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">

        <div id="signup-box">
            <h2>Create Account</h2>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required placeholder="Create a password">
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <p class="toggle-text">Already have an account? <a href="#" id="to-login">Login here</a></p>
        </div>

        <div id="login-box" class="hidden">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter your password">
                </div>
                <button type="submit">Login</button>
            </form>
            <p class="toggle-text">Don't have an account? <a href="#" id="to-signup">Sign up here</a></p>
        </div>

    </div>

    <script>
        var signupBox = document.getElementById('signup-box');
        var loginBox = document.getElementById('login-box');
        var toLoginLink = document.getElementById('to-login');
        var toSignupLink = document.getElementById('to-signup');
        var signupForm = document.getElementById('signup-form');
        var loginForm = document.getElementById('login-form');

        toLoginLink.addEventListener('click', function(event) {
            event.preventDefault();
            signupBox.classList.add('hidden');
            loginBox.classList.remove('hidden');
        });

        toSignupLink.addEventListener('click', function(event) {
            event.preventDefault();
            loginBox.classList.add('hidden');
            signupBox.classList.remove('hidden');
        });

        signupForm.addEventListener('submit', function(event) {
            event.preventDefault();

            var email = document.getElementById('signup-email').value;
            var password = document.getElementById('signup-password').value;

            // Save email and password in localStorage
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPassword', password);
            localStorage.setItem('isLoggedIn', 'true');

            window.location.href = "profile.html";
        });

        loginForm.addEventListener('submit', function(event) {
            event.preventDefault();

            var email = document.getElementById('login-email').value;
            var password = document.getElementById('login-password').value;

            // Check if email and password match what was saved
            var savedEmail = localStorage.getItem('userEmail');
            var savedPassword = localStorage.getItem('userPassword');

            if (email === savedEmail && password === savedPassword) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = "dashboard.html";
            } else {
                alert("Wrong email or password. Please try again.");
            }
        });
    </script>

</body>
</html>
