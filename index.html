<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth & Profile System</title>
    
    <link rel="stylesheet" href="css/style.css">
    <style>
       
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="signup-box">
            <h2>Create Account</h2>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required placeholder="Create a password">
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <p class="toggle-text">Already have an account? <a href="#" id="to-login">Login here</a></p>
        </div>

        <div id="login-box" class="hidden">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter your password">
                </div>
                <button type="submit">Login</button>
            </form>
            <p class="toggle-text">Don't have an account? <a href="#" id="to-signup">Sign up here</a></p>
        </div>

        <div id="info-box" class="hidden">
            <h2>Personal Information</h2>
            <p class="success-message">Success! Please complete your profile.</p>
            
            <form id="info-form">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="contact-number">Contact Number</label>
                    <input type="tel" id="contact-number" required placeholder="123-456-7890">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label for="education">Highest Education</label>
                    <select id="education" required class="select-input">
                        <option value="" disabled selected>Select your qualification</option>
                        <option value="High School">High School</option>
                        <option value="Bachelor's Degree">Bachelor's Degree</option>
                        <option value="Master's Degree">Master's Degree</option>
                        <option value="Ph.D.">Ph.D.</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Skills (Select all that apply)</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="skills" value="HTML/CSS"> HTML & CSS
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="skills" value="JavaScript"> JavaScript
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="skills" value="Graphic Design"> Graphic Design
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio">Short Bio</label>
                    <textarea id="bio" rows="3" placeholder="Tell us about yourself..."></textarea>
                </div>

                <button type="submit">Save Profile</button>
            </form>
        </div>
    </div>

    <script>
       
        const signupBox = document.getElementById('signup-box');
        const loginBox  = document.getElementById('login-box');
        const infoBox   = document.getElementById('info-box');

        
        const toLoginLink  = document.getElementById('to-login');
        const toSignupLink = document.getElementById('to-signup');

     
        const signupForm = document.getElementById('signup-form');
        const loginForm  = document.getElementById('login-form');
        const infoForm   = document.getElementById('info-form');

        toLoginLink.addEventListener('click', function(event) {
            event.preventDefault();             
            signupBox.classList.add('hidden');  
            loginBox.classList.remove('hidden'); 
        });


        toSignupLink.addEventListener('click', function(event) {
            event.preventDefault();             
            loginBox.classList.add('hidden');   
            signupBox.classList.remove('hidden');
        });

        signupForm.addEventListener('submit', function(event) {
            event.preventDefault();             
            signupBox.classList.add('hidden');  
            infoBox.classList.remove('hidden');  
        });

        loginForm.addEventListener('submit', function(event) {
            event.preventDefault();             
            loginBox.classList.add('hidden');   
            infoBox.classList.remove('hidden');  
        });

       
        infoForm.addEventListener('submit', function(event) {
            event.preventDefault();             
            
            const fullName = document.getElementById('full-name').value;
            const phone = document.getElementById('contact-number').value;
            const education = document.getElementById('education').value;
            
            const checkedSkills = [];
            const skillCheckboxes = document.querySelectorAll('input[name="skills"]:checked');
            
            skillCheckboxes.forEach(function(checkbox) {
                checkedSkills.push(checkbox.value);
            });

            alert(
                "Profile Saved Successfully!\n\n" +
                "Name: " + fullName + "\n" +
                "Phone: " + phone + "\n" +
                "Education: " + education + "\n" +
                "Skills: " + (checkedSkills.length > 0 ? checkedSkills.join(', ') : "None selected")
            );
        });
    </script>
</body>
</html>
